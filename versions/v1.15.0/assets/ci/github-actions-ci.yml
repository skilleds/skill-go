# schematize-go — workflow de CI de referência (§13, §21, a `schematize-qa`, §35).
# Copie para .github/workflows/ci.yml e ajuste <projeto>/comandos da sua stack.
#
# PISO 27 — CI remoto NÃO roda por commit (custo). O gate por commit é LOCAL (assets/hooks/.pre-commit-config.yaml
# + scripts/check-diff.sh --staged); os commits se acumulam. Este workflow roda só: (a) uma vez antes de promover
# para hml (tag `hml-*`), (b) em release (tag `v*`), (c) quando o usuário pedir (workflow_dispatch).
# VETADO `pull_request`/`pull_request_target` (qualquer filtro), `push` em branch, `workflow_run`, `merge_group`,
# cron sem justificativa. Não existe "check obrigatório no PR". Gate: check-ci-triggers.sh (job standards-gate).
name: ci
on:
  workflow_dispatch:
  push:
    tags: ["hml-*", "v*"]
    paths-ignore: ["**.md", "docs/**", "*_archive/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with: { fetch-depth: 0 }
      - name: Gate de padrões (DoD/§37) no diff
        # Tag de promoção: diff desde a tag ANTERIOR (sem tag anterior: contra origin/main). Não há PR, então nada de
        # github.base_ref; e base==HEAD é bloqueada pelo próprio script (diff vazio = falso verde).
        run: |
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || echo origin/main)"
          bash .claude/skills/schematize-go/scripts/check-diff.sh "$PREV"
      - name: Índice de microfunções atualizado (§39)
        env:
          # Sem estes dois o gate NAO roda — e nao rodar REPROVA. Gate desarmado em silencio
          # ("|| true" + diff comentado) foi o achado A5 da vistoria de 2026-08-21.
          INDEX_SRC: ${{ vars.INDEX_SRC || './internal' }}
          INDEX_FILE: ${{ vars.INDEX_FILE }}
        run: bash .claude/skills/schematize-go/scripts/check-index.sh
      - name: Scan de segredo no archive (§16.1/§32)
        run: bash .claude/skills/schematize-go/scripts/archive-secret-scan.sh .
      - name: Efeito externo não escapa de não-produção (§37, "Disparar efeito externo REAL a partir de não-produção")
        env:
          TEST_MAIL_DOMAIN: test.<domain>   # ajuste; o gate confere o null MX por dig
        run: bash .claude/skills/schematize-go/scripts/check-external-effects.sh .
      - name: Deploy só do git (pisos 22/23) — sem scp/rsync/tar|ssh
        env:
          SKIP_GIT: "1"   # no CI o checkout é destacado; HEAD==origin vale local/overdev
        run: bash .claude/skills/schematize-engineering/scripts/check-deploy-git.sh .
      - name: Gatilhos de CI (piso 27) — nada de on:push em branch / pull_request / sem concurrency
        run: bash .claude/skills/schematize-engineering/scripts/check-ci-triggers.sh .
      - name: Resiliência do microserviço (piso 28) — OPCIONAL; ative com a variável RESILIENCE_DIRS (dirs com resilience.yml, separados por espaço)
        if: ${{ vars.RESILIENCE_DIRS != '' }}
        run: |
          for d in ${{ vars.RESILIENCE_DIRS }}; do
            bash .claude/skills/schematize-engineering/scripts/check-resilience.sh "$d"
          done

  go-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: { go-version-file: go.mod }   # a toolchain vem do go.mod (build reprodutível)
      - name: Dependências íntegras (go mod verify) e go.mod/go.sum sem sujeira (go mod tidy -diff)
        run: go mod verify && go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: golangci-lint v2 (inclui staticcheck, errcheck, gosec, depguard — config assets/lint/.golangci.yml)
        # O passo FALHA se o linter sair != 0 (sem `|| true`): schema v1 de config vira erro, nao aviso.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with: { version: v2.14.0 }
      - name: govulncheck (vulnerabilidade com alcançabilidade — trava o merge)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Testes com race detector (concorrência real — references/concorrencia.md)
        run: go test -race -count=1 -shuffle=on -coverprofile=cover.out ./...

  test-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Smoke + security + authz + hardening (tag de promoção — a `schematize-qa` (gates de CI, `references/execucao.md` secao 6))
        run: |
          # LIGUE ao CLI do projeto. Enquanto o placeholder existir o passo REPROVA (verde de mentira é vetado).
          echo "ERRO: ligue o test kit do <projeto>_ops (smoke/security/authz/hardening) antes de usar este template" >&2
          exit 1
          # <projeto> test smoke && <projeto> test security && <projeto> test authz && <projeto> test hardening
      - name: Smoke self-check (anti verde-mentiroso — a `schematize-qa` (smoke e matriz simulated, `references/categorias.md` secoes 5 e 10))
        run: bash .claude/skills/schematize-go/scripts/smoke-selfcheck.sh --self-check

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Trivy fs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, severity: HIGH,CRITICAL, exit-code: '1' }
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
